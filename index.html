<style>

    --header: #0c1116;
    --header-ink: #f3eee6;
    --good: #9ed4b4;

    --bad: #f0aaa4;

  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {

    background: var(--bg);

    overflow-x: hidden;

  button:focus-visible, a:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;

    background: var(--header);
    color: var(--header-ink);

    font-family: var(--serif);

    font-size: clamp(0.95rem, 2.6vw, 1.2rem);
    line-height: 1.15;

    display: block;
    font-family: var(--sans);

    text-transform: uppercase;
    font-size: 0.68rem;
    opacity: 0.78;

    border: 1px solid rgba(246, 241, 232, 0.35);
    background: transparent;
    color: var(--header-ink);
    border-radius: 999px;
    min-height: 44px;
    padding: 0 14px;
    font-size: 0.92rem;

  main { width: min(920px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 72px; }
  .kicker {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--warm);
    font-weight: 700;
    margin: 0 0 8px;
  }
  h1.hero {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.1rem, 7vw, 3.6rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin: 0 0 12px;

    gap: 0;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;

  .card .body { padding: 16px 16px 18px; }

  .card p { margin: 0 0 12px; color: var(--muted); font-size: 0.98rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill {
    font-size: 0.78rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--muted);

  .bar span { display: block; height: 100%; background: var(--accent); width: 0; }

    font-family: var(--serif);
    font-size: clamp(1.7rem, 4.5vw, 2.4rem);
    line-height: 1.12;
    margin: 0 0 8px;

    margin: 14px 0 18px;
    background: var(--surface);

    font-size: 0.75rem;
    color: var(--muted);

  h4 { margin: 16px 0 6px; font-size: 1rem; }

  ul, ol { margin: 0 0 14px; padding-left: 1.2rem; max-width: 68ch; }
  li { margin: 0 0 6px; }
  .note {
    border-left: 3px solid var(--warm);
    padding: 8px 12px;
    margin: 0 0 14px;
    color: var(--ink);
    background: var(--accent-soft);
    border-radius: 0 10px 10px 0;
    max-width: 68ch;

    border-radius: var(--radius);
    background: var(--surface);

    text-align: left;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    min-height: 44px;
    padding: 10px 12px;
    font-size: 1rem;
    line-height: 1.35;

  .opt.right { background: var(--good-bg); border-color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .fb { margin: 10px 0 0; font-size: 0.98rem; }
  .fb.ok { color: var(--good); }
  .fb.no { color: var(--bad); }
  .navrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .primary, .ghost {

    padding: 0 16px;
    font-size: 0.98rem;

  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

  .score {

    font-size: clamp(2rem, 6vw, 3rem);
    margin: 8px 0;

  .modal-back {

    z-index: 40; padding: 16px;

  .modal {
    width: min(460px, 100%);
    background: var(--surface);
    color: var(--ink);
    border-radius: 16px;
    padding: 18px;
    border: 1px solid var(--line);
  }
  .modal h3 { margin-top: 0; }
  .hidden { display: none !important; }
  .source { font-size: 0.82rem; color: var(--muted); margin-top: 22px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

        title: "El PCG como sistema",
        html: `
          <h4>Entradas</h4>
          <p>Son los insumos que entran al PCG.</p>
          <ul>
            <li><strong>Disposiciones constitucionales y legales:</strong> el marco jurídico de las finanzas públicas.</li>
            <li><strong>Reglas contables macroeconómicas:</strong> lineamientos del FMI (producto interno bruto, ingresos nacionales, balanza de pagos, relación deuda pública–producto interno bruto) y del IPSASB para la información consolidada.</li>
            <li><strong>Reguladores:</strong> la Contraloría fija métodos y sistemas de contabilidad de dependencias nacionales, municipales, autónomas o semiautónomas, empresas públicas y juntas comunales. El Ministerio de Economía y Finanzas presenta los estados consolidados y administra la infraestructura tecnológica.</li>

            <li><strong>Supervisión y control:</strong> Contraloría, Ministerio de Economía y Finanzas y Superintendencias.</li>
            <li><strong>Infraestructura tecnológica</strong> para procesar y obtener información consolidada.</li>
            <li><strong>Usuarios:</strong> Órgano Legislativo, administración central, Contraloría, ciudadanos, residentes que no califican como ciudadanos, organismos internacionales bilaterales y multilaterales, proveedores, prestamistas y corporaciones.</li>

            <li>Compilación conceptual, comunicada a las entidades y al Ministerio de Economía y Finanzas para adecuar sus aplicativos.</li>

          <h4>Retroalimentación y control</h4>
          <p>La retroalimentación evalúa el desempeño para mejorar el PCG. La lectura señala cinco aspectos: capacidades del recurso humano, aplicación de la normativa, calidad de los datos, oportunidad de la información y operatividad de la infraestructura tecnológica.</p>
          <p>El control es el seguimiento constante: ¿la información sirve para decidir, controlar y rendir cuentas? Si algo lo impide, se ajustan las entradas y el procesamiento.</p>`,

      {
        title: "El PCI en la entidad",
        html: `
          <p>El PCI recopila, clasifica, analiza, registra y procesa los hechos económicos de la entidad. Así produce información para decidir, rendir cuentas, evaluar la gestión, apoyar la consolidación y ejercer el control interno y externo.</p>
          <p>Esa información es el insumo principal de los Estados Financieros Consolidados del Sector Público. El Ministerio de Economía y Finanzas dirige la administración financiera del Estado. Esos estados pasan a ser fuente oficial de la situación del sector público una vez que los examina la Contraloría General de la República.</p>

            <li><strong>Plan general de cuentas:</strong> códigos y conceptos metódicos, flexibles, homogéneos y con terminología clara.</li>
            <li><strong>Hechos económicos</strong> de la misión institucional, con respaldo documental.</li>
            <li><strong>Documentos fuente</strong> internos o externos: contratos, órdenes de compra, nóminas, viáticos, facturas, recepciones y despachos, actas de disposición final, cheques, entre otros.</li>

          <p>Esas etapas son de quienes llevan la contabilidad, conforme a la NICSP, el Manual y la Contraloría.</p>

        title: "Del documento al asiento",
        html: `
          <p>Las herramientas de la gestión contable y documental son los documentos fuente, los comprobantes de diario y los libros principales y auxiliares. Pueden llevarse a mano o mecanizarse.</p>
          <p>El documento fuente da sustento y evidencia del hecho económico. Aporta datos para analizar, reconocer y comprobar. Respalda el comprobante de diario y se archiva como fue expedido, con los medios tecnológicos de la entidad y los lineamientos de las autoridades.</p>
          <ul>
            <li><strong>Interno:</strong> lo genera la entidad sin afectación directa con otras personas. Sirve para amortizaciones, depreciaciones, deterioros, agotamiento, revaluaciones, despachos, disposiciones finales y ajustes.</li>
            <li><strong>Externo:</strong> vincula a la entidad con otras personas. Ejemplos de la lectura: recibos de ingresos, boletas de depósitos, contratos, órdenes de compra, facturas, recepciones de bienes, actas de aceptación de servicios, cheques girados, comprobantes de cajas menudas y planillas.</li>
          </ul>
          <p>El comprobante de diario registra el asiento del hecho. Se hace a mano o mecanizado, a partir del documento fuente. La Contraloría, organismo rector, define tipos, periodicidad, conservación, numeración y responsables.</p>
          <p>Cada comprobante indica fecha, número de transacción, código y nombre de las cuentas, valores, débito o crédito, y conserva la partida doble. Lleva una explicación breve y la identificación de quien lo elabora y de quien lo aprueba.</p>`,

      {
        title: "Libros y formalidades",
        html: `
          <p>Los libros registran, de forma sistematizada, analítica y sintetizada, hechos reconocidos y medidos según las NICSP. Si se usan aplicativos, deben poder imprimirse el diario general, el mayor general y los auxiliares.</p>
          <p>Los <strong>principales</strong> asientan en orden cronológico y sintetizado lo que traen los comprobantes. Son el diario general y el mayor general.</p>
          <ul>
            <li><strong>Diario general:</strong> libro de entrada original. Registra los asientos de los comprobantes.</li>
            <li><strong>Mayor general:</strong> clasifica las cuentas del plan general. Anota débitos y créditos y muestra saldos.</li>
          </ul>
          <p>Los <strong>auxiliares</strong> detallan, en orden cronológico, lo que sostienen los principales:</p>
          <ul>
            <li><strong>Cuentas por cobrar:</strong> movimientos por deudor y sus saldos.</li>
            <li><strong>Inventarios:</strong> entradas, salidas, bajas y saldos; fechas, tipos, marcas, modelos, ubicación, proveedores y documentos de entrada, salida y disposición final.</li>
            <li><strong>Propiedad, planta y equipo:</strong> cantidades y valores del activo fijo, bajas, deterioros, amortizaciones, revaluaciones y saldos, con datos de identificación y documentos de adquisición.</li>
            <li><strong>Cuentas por pagar:</strong> movimientos por acreedor, con fechas, datos del acreedor y documentos de compra.</li>
            <li><strong>Ingresos presupuestarios:</strong> corrientes y de capital, según las partidas del Presupuesto General del Estado.</li>
            <li><strong>Gastos presupuestarios:</strong> corrientes y de capital, según las etapas de las Normas Generales de Administración Presupuestaria.</li>
          </ul>
          <p>La Contraloría oficializa los libros principales con registro, foliación y rúbrica, en actas de apertura. Si son manuales, antes de usarlos. Si salen de un aplicativo, los impresos se oficializan dentro de los quince días siguientes a cada trimestre. Los auxiliares se registran y rubrican en administración o finanzas, en el registro llamado «Control de libros de contabilidad».</p>
          <p>Se llevan en español y se conservan de modo que autenticidad e integridad queden a salvo. Si el registro es electrónico, se graban copias de respaldo en medios magnéticos. No se alteran fechas, no se dejan espacios en blanco, no se borra, tacha, interlinea ni se cambian hojas. Un error de transcripción se corrige con otro comprobante de diario. Anular un folio se hace sobre el mismo, con causa, fecha, nombre y firma. Libros, comprobantes y documentos fuente quedan a disposición de la Contraloría y de las demás autoridades. Si hay pérdida, hurto o destrucción, el custodio lo denuncia y lo informa a la Contraloría y al Ministerio de Economía y Finanzas.</p>`,

  l3: {
    title: "Estructura y clasificación del control interno",
    blurb: "Qué sostiene la confianza en la información y cómo se cuida el proceso contable.",
    cover: svg.cover3,
    source: "Contraloría General de la República (2017), Gaceta Oficial Digital del 17 de enero.",
    modules: [
      {
        title: "Estructura y componentes",
        html: `
          <p>El control interno es un proceso de la máxima autoridad, el consejo de directores, los jefes de departamento y el resto de servidores públicos. Busca salvaguardar los activos y dar una seguridad razonable sobre cuatro categorías: eficacia (lograr los objetivos), eficiencia (menor costo), confiabilidad de la información financiera y cumplimiento de las disposiciones legales y administrativas.</p>
          <p>Su estructura son las disposiciones legales, políticas y procedimientos que dan a la administración una garantía razonable de cumplir objetivos y metas. También sujeta los actos administrativos al principio de legalidad.</p>
          <p>Cinco componentes se relacionan entre sí:</p>
          <ol>
            <li><strong>Ambiente de control.</strong> Es el entorno que influye en cómo el personal controla su trabajo. Sobre él se apoyan los otros cuatro. Incluye integridad, ética, capacidad, estilo directivo, estructura, asignación de autoridad y políticas de recurso humano.</li>
            <li><strong>Evaluación de riesgos.</strong> Identifica y analiza riesgos relevantes, también los que traen los cambios internos y del entorno.</li>
            <li><strong>Información y comunicación.</strong> Identifica, ordena, registra, produce, publica y protege información operativa y financiera veraz y oportuna, y la comunica.</li>
            <li><strong>Actividades de control.</strong> Políticas y procedimientos que limitan los riesgos que amenazan los objetivos.</li>
            <li><strong>Monitoreo o supervisión.</strong> Evaluación continua o periódica, según la importancia del riesgo, para comprobar que el sistema funciona y ajustar a tiempo.</li>
          </ol>
          <p>El diseño de esa estructura persigue, entre otros fines, planificación y presupuesto con economía, eficiencia y efectividad; una estructura orgánica que permita asignar responsabilidades; un instrumento normativo para los controles del proceso contable; personal calificado; protección de recursos; respuesta a los riesgos; información oportuna, confiable, exacta e íntegra; operaciones conforme a la ley; y un monitoreo que se adapte a los cambios.</p>
          <p>Visto como sistema, el proceso contable lleva el control interno contable en cada eslabón: entradas, proceso, salidas y realimentación. El recorrido específico de los hechos pasa por reconocimiento, medición inicial y posterior, presentación y revelación, junto con la gestión contable y documental.</p>`,

          prompt: "¿Sobre qué componente se apoyan los otros cuatro?",
          options: ["El monitoreo", "La información y comunicación", "El ambiente de control"],
          answer: 2,
          why: "La lectura lo llama el principal elemento sobre el que se sustentan o actúan los otros cuatro: integridad, ética, capacidad y el entorno de gestión."
        }

let state = loadAll();
let view = { screen: "home", id: null, mod: 0, q: 0 };

function emptyProg() { return { acts: {}, quiz: {}, quizDone: false }; }
function loadAll() {
  const out = {};
  for (const id of ["l1", "l2", "l3"]) {
    try { out[id] = Object.assign(emptyProg(), JSON.parse(localStorage.getItem(STORE[id]) || "null") || {}); }
    catch (e) { out[id] = emptyProg(); }
  }
  return out;
}
function save(id) { localStorage.setItem(STORE[id], JSON.stringify(state[id])); }
function theme() { return localStorage.getItem(STORE.theme) || "light"; }
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  const b = document.getElementById("btnTheme");
  b.textContent = t === "dark" ? "Oscuro" : "Claro";
  b.setAttribute("aria-pressed", t === "dark" ? "true" : "false");
  b.setAttribute("aria-label", t === "dark" ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
}
function progressOf(id) {
  const L = lectures[id];
  const p = state[id];
  const mods = L.modules.filter((_, i) => p.acts[i] && p.acts[i].ok !== undefined).length;
  const quiz = p.quizDone ? 1 : 0;
  return { mods, total: L.modules.length, quiz, pct: Math.round(((mods + quiz) / (L.modules.length + 1)) * 100) };
}

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}

function render(doScroll) {
  const app = document.getElementById("app");
  if (view.screen === "home") app.innerHTML = homeHTML();
  else if (view.screen === "mod") app.innerHTML = modHTML();
  else app.innerHTML = quizHTML();
  bind();
  if (doScroll !== false) window.scrollTo(0, 0);
}

function homeHTML() {
  const cards = ["l1", "l2", "l3"].map((id, n) => {
    const L = lectures[id];
    const pr = progressOf(id);
    const q = pr.quiz ? "Cuestionario hecho" : "Cuestionario pendiente";
    return `<button class="card" type="button" data-open="${id}">
      <div class="art">${L.cover}</div>
      <div class="body">
        <p class="kicker">Lectura ${n + 1}</p>
        <h2>${esc(L.title)}</h2>
        <p>${esc(L.blurb)}</p>
        <div class="meta">
          <span class="pill">${pr.mods} de ${pr.total} módulos</span>
          <span class="pill">${q}</span>
          <span class="bar" aria-hidden="true"><span style="width:${pr.pct}%"></span></span>
        </div>
      </div>
    </button>`;
  }).join("");
  return `<p class="kicker">Unidad 1</p>
    <h1 class="hero">Profesor Sergio Tertusio</h1>
    <p class="lede">Contabilidad gubernamental. Tres lecturas para comprender cómo se produce, se documenta y se controla la información del sector público. El avance de cada lectura se guarda por separado.</p>
    <div class="cards">${cards}</div>`;
}

function modHTML() {
  const L = lectures[view.id];
  const m = L.modules[view.mod];
  const p = state[view.id];
  const steps = L.modules.map((mod, i) => {
    const done = p.acts[i] && p.acts[i].ok !== undefined;
    return `<button class="step${done ? " done" : ""}" type="button" data-mod="${i}" aria-current="${i === view.mod ? "true" : "false"}">${i + 1}. ${esc(mod.title)}</button>`;
  }).join("");
  return `<article class="lecture-head">
      <p class="kicker">Lectura ${view.id.slice(1)}</p>
      <h1>${esc(L.title)}</h1>
      <p class="lede">${esc(L.blurb)}</p>
    </article>
    <div class="steps">${steps}<button class="step" type="button" data-quiz="1">Cuestionario</button></div>
    ${view.mod === 0 ? `<figure class="figure coverfig">${L.cover}<figcaption>Ilustración original de portada. Resume el tema de la lectura sin añadir datos.</figcaption></figure>` : ""}
    <h3>${esc(m.title)}</h3>
    ${m.html}
    <figure class="figure">${m.fig}<figcaption>${esc(m.cap)}</figcaption></figure>
    ${activityHTML(m.activity, p.acts[view.mod])}
    <div class="navrow">
      ${view.mod > 0 ? `<button class="ghost" type="button" data-mod="${view.mod - 1}">Módulo anterior</button>` : ""}
      ${view.mod < L.modules.length - 1 ? `<button class="primary" type="button" data-mod="${view.mod + 1}">Siguiente módulo</button>` : `<button class="primary" type="button" data-quiz="1">Ir al cuestionario</button>`}
    </div>
    <p class="source">Fuente de esta lectura: ${esc(L.source)} Ilustraciones originales de la lección; no añaden datos ajenos al texto.</p>`;
}

function activityHTML(act, saved) {
  if (act.kind === "order") return orderHTML(act, saved);
  const locked = saved && saved.ok !== undefined;
  const opts = act.options.map((op, i) => {
    let cls = "opt";
    if (locked && i === act.answer) cls += " right";
    else if (locked && saved.pick === i && i !== act.answer) cls += " wrong";
    return `<button class="${cls}" type="button" data-pick="${i}" ${locked ? "disabled" : ""}>${esc(op)}</button>`;
  }).join("");
  let fb = "";
  if (locked) {
    fb = `<p class="fb ${saved.ok ? "ok" : "no"}">${saved.ok ? "Correcto. " : "No es esa. "}${esc(act.why)}</p>`;
  }
  return `<section class="activity"><h4>Actividad</h4><p>${esc(act.prompt)}</p><div class="opts">${opts}</div>${fb}</section>`;
}

function orderHTML(act, saved) {
  const locked = saved && saved.ok !== undefined;
  if (!locked) {
    const opts = act.options.map((op, i) => `<button class="opt" type="button" data-ord="${i}">${esc(op)}</button>`).join("");
    const chosen = (view.order || []).map(i => act.options[i]);
    const hint = chosen.length ? `<p class="fb">Orden elegido: ${chosen.map(esc).join(" → ")}</p>` : "";
    return `<section class="activity"><h4>Actividad</h4><p>${esc(act.prompt)}</p><div class="opts">${opts}</div>${hint}
      <div class="navrow"><button class="ghost" type="button" id="ordClear">Limpiar orden</button></div></section>`;
  }
  const fb = `<p class="fb ${saved.ok ? "ok" : "no"}">${saved.ok ? "Correcto. " : "Ese no es el orden de la lectura. "}${esc(act.why)}</p>`;
  return `<section class="activity"><h4>Actividad</h4><p>${esc(act.prompt)}</p>${fb}</section>`;
}

function quizHTML() {
  const L = lectures[view.id];
  const p = state[view.id];
  const pr = progressOf(view.id);
  const steps = L.modules.map((mod, i) => `<button class="step" type="button" data-mod="${i}">${i + 1}. ${esc(mod.title)}</button>`).join("");
  if (p.quizDone) {
    const score = L.quiz.reduce((n, q, i) => n + (p.quiz[i] === q.a ? 1 : 0), 0);
    return `<p class="kicker">Cuestionario · Lectura ${view.id.slice(1)}</p>
      <h1>${esc(L.title)}</h1>
      <div class="steps">${steps}<button class="step" type="button" data-quiz="1" aria-current="true">Cuestionario</button></div>
      <p class="score">${score} de 10</p>
      <p>${score >= 8 ? "Leíste con atención las ideas centrales de esta lectura." : "Conviene volver a los módulos de esta lectura y revisar las explicaciones."} El puntaje es solo de esta lectura.</p>
      <div class="navrow"><button class="primary" type="button" id="retry">Reintentar cuestionario</button></div>
      <p class="source">Módulos completados en esta lectura: ${pr.mods} de ${pr.total}. Fuente: ${esc(L.source)}</p>`;
  }
  const q = L.quiz[view.q];
  const picked = p.quiz[view.q];
  const locked = picked !== undefined;
  const opts = q.options.map((op, i) => {
    let cls = "opt";
    if (locked && i === q.a) cls += " right";
    else if (locked && picked === i && i !== q.a) cls += " wrong";
    return `<button class="${cls}" type="button" data-qp="${i}" ${locked ? "disabled" : ""}>${esc(op)}</button>`;
  }).join("");
  let fb = "";
  if (locked) {
    const ok = picked === q.a;
    fb = `<p class="fb ${ok ? "ok" : "no"}">${ok ? "Correcto. " : "Incorrecto. "}${esc(q.why)}</p>`;
  }
  return `<p class="kicker">Cuestionario · Lectura ${view.id.slice(1)}</p>
    <h1>${esc(L.title)}</h1>
    <div class="steps">${steps}<button class="step" type="button" data-quiz="1" aria-current="true">Cuestionario</button></div>
    <p class="qhead"><span>Pregunta ${view.q + 1} de 10</span><span>${q.t === "tf" ? "Verdadero o falso" : "Opción múltiple"}</span></p>
    <h3>${esc(q.q)}</h3>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="navrow">
      ${view.q > 0 ? `<button class="ghost" type="button" id="qPrev">Anterior</button>` : ""}
      ${locked && view.q < 9 ? `<button class="primary" type="button" id="qNext">Siguiente</button>` : ""}
      ${locked && view.q === 9 ? `<button class="primary" type="button" id="qFinish">Ver puntaje</button>` : ""}
    </div>`;
}

function bind() {
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
    view = { screen: "mod", id: b.dataset.open, mod: 0, q: 0, order: [] };
    render();
  }));
  document.querySelectorAll("[data-mod]").forEach(b => b.addEventListener("click", () => {
    view.screen = "mod";
    view.mod = Number(b.dataset.mod);
    view.order = [];
    render();
  }));
  document.querySelectorAll("[data-quiz]").forEach(b => b.addEventListener("click", () => {
    view.screen = "quiz";
    const p = state[view.id];
    if (!p.quizDone) {
      const first = lectures[view.id].quiz.findIndex((_, i) => p.quiz[i] === undefined);
      view.q = first === -1 ? 0 : first;
    }
    render();
  }));
  document.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
    const act = lectures[view.id].modules[view.mod].activity;
    const pick = Number(b.dataset.pick);
    state[view.id].acts[view.mod] = { pick, ok: pick === act.answer };
    save(view.id);
    render(false);
  }));
  document.querySelectorAll("[data-ord]").forEach(b => b.addEventListener("click", () => {
    const i = Number(b.dataset.ord);
    view.order = view.order || [];
    if (view.order.includes(i)) return;
    view.order.push(i);
    const act = lectures[view.id].modules[view.mod].activity;
    if (view.order.length === act.options.length) {
      const ok = act.answer.every((n, idx) => view.order[idx] === n);
      state[view.id].acts[view.mod] = { order: view.order.slice(), ok };
      save(view.id);
    }
    render(false);
  }));
  const clr = document.getElementById("ordClear");
  if (clr) clr.addEventListener("click", () => { view.order = []; render(); });
  document.querySelectorAll("[data-qp]").forEach(b => b.addEventListener("click", () => {
    state[view.id].quiz[view.q] = Number(b.dataset.qp);
    save(view.id);
    render(false);
  }));
  const prev = document.getElementById("qPrev");
  const next = document.getElementById("qNext");
  const fin = document.getElementById("qFinish");
  const retry = document.getElementById("retry");
  if (prev) prev.addEventListener("click", () => { view.q -= 1; render(); });
  if (next) next.addEventListener("click", () => { view.q += 1; render(); });
  if (fin) fin.addEventListener("click", () => {
    state[view.id].quizDone = true;
    save(view.id);
    render();
  });
  if (retry) retry.addEventListener("click", () => {
    state[view.id].quiz = {};
    state[view.id].quizDone = false;
    save(view.id);
    view.q = 0;
    render();
  });
}

document.getElementById("btnMenu").addEventListener("click", () => {
  view = { screen: "home", id: null, mod: 0, q: 0 };
  render();
});
document.getElementById("btnTheme").addEventListener("click", () => {
  const next = theme() === "dark" ? "light" : "dark";
  localStorage.setItem(STORE.theme, next);
  applyTheme(next);
});
document.getElementById("btnReset").addEventListener("click", () => {
  const modal = document.getElementById("modal");
  modal.className = "modal-back";
  modal.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rstTitle">
    <h3 id="rstTitle">Reiniciar el avance</h3>
    <p>Se borrará el avance de las tres lecturas: módulos, actividades y cuestionarios. El modo claro u oscuro se conserva.</p>
    <div class="navrow">
      <button class="ghost" type="button" id="rstNo">Cancelar</button>
      <button class="primary" type="button" id="rstYes">Borrar avance</button>
    </div>
  </div>`;
  document.getElementById("rstNo").focus();
  document.getElementById("rstNo").onclick = () => { modal.className = "hidden"; modal.innerHTML = ""; };
  document.getElementById("rstYes").onclick = () => {
    for (const id of ["l1", "l2", "l3"]) {
      localStorage.removeItem(STORE[id]);
      state[id] = emptyProg();
    }
    modal.className = "hidden";
    modal.innerHTML = "";
    view = { screen: "home", id: null, mod: 0, q: 0 };
    render();
  };
});

applyTheme(theme());
render();
</script>
</body>
</html>
